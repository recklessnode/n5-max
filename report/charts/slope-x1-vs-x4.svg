<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><rect width="960" height="430" rx="14" fill="#151a1f"/><text x="24" y="34" font-family="Orbitron, Ubuntu, sans-serif" font-size="17" font-weight="700" fill="#e9e6e0" letter-spacing="0.5">The x1 lane tax: one NM790 on Gen4 x1 vs Gen4 x4</text><text x="24" y="56" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" fill="#9aa3ab">Same drive model, ZFS single-drive pool, cold. Ratio x4 ÷ x1 per test; the dashed line is the 4.0× lane-bandwidth ratio.</text><text x="24" y="418" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="10.5" fill="#5f6a73">Sequential work pays the lane tax; small-block random and sync work is drive-bound, so the four x1 slots cost little there.</text><line x1="390.0" y1="80.0" x2="390.0" y2="380.0" stroke="#262e36" stroke-width="1" stroke-opacity="1" stroke-linecap="butt"/><text x="390.0" y="398.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9aa3ab" text-anchor="middle" opacity="1">1×</text><line x1="540.0" y1="80.0" x2="540.0" y2="380.0" stroke="#262e36" stroke-width="1" stroke-opacity="1" stroke-linecap="butt"/><text x="540.0" y="398.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9aa3ab" text-anchor="middle" opacity="1">2×</text><line x1="690.0" y1="80.0" x2="690.0" y2="380.0" stroke="#262e36" stroke-width="1" stroke-opacity="1" stroke-linecap="butt"/><text x="690.0" y="398.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9aa3ab" text-anchor="middle" opacity="1">3×</text><line x1="840.0" y1="80.0" x2="840.0" y2="380.0" stroke="#262e36" stroke-width="1" stroke-opacity="1" stroke-linecap="butt" stroke-dasharray="4 4"/><text x="840.0" y="398.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9aa3ab" text-anchor="middle" opacity="1">4×</text><text x="840.0" y="76.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#facc15" text-anchor="middle" opacity="1">lane ratio 7.88 / 1.969 = 4.0×</text><text x="30.0" y="106.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">seq read 1M ×4</text><text x="348.0" y="106.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9aa3ab" text-anchor="end" opacity="1">1.8 → 5.888 GB/s</text><line x1="390.0" y1="102.0" x2="730.7" y2="102.0" stroke="#E86A2B" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="390.0" cy="102.0" r="4.0" fill="#8b949e" opacity="1"/><circle cx="730.7" cy="102.0" r="6.0" fill="#E86A2B" opacity="1"/><text x="742.7" y="106.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#E86A2B" text-anchor="start" opacity="1">3.27×</text><text x="30.0" y="146.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">seq write 1M ×4</text><text x="348.0" y="146.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9aa3ab" text-anchor="end" opacity="1">0.641 → 1.328 GB/s</text><line x1="390.0" y1="142.0" x2="550.8" y2="142.0" stroke="#E86A2B" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="390.0" cy="142.0" r="4.0" fill="#8b949e" opacity="1"/><circle cx="550.8" cy="142.0" r="6.0" fill="#E86A2B" opacity="1"/><text x="562.8" y="146.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#E86A2B" text-anchor="start" opacity="1">2.07×</text><text x="30.0" y="186.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">rand write 16K</text><text x="348.0" y="186.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9aa3ab" text-anchor="end" opacity="1">16,762 → 47,112 IOPS</text><line x1="390.0" y1="182.0" x2="661.6" y2="182.0" stroke="#E86A2B" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="390.0" cy="182.0" r="4.0" fill="#8b949e" opacity="1"/><circle cx="661.6" cy="182.0" r="6.0" fill="#E86A2B" opacity="1"/><text x="673.6" y="186.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#E86A2B" text-anchor="start" opacity="1">2.81×</text><text x="30.0" y="226.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">rand read 4K</text><text x="348.0" y="226.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9aa3ab" text-anchor="end" opacity="1">35,116 → 41,318 IOPS</text><line x1="390.0" y1="222.0" x2="416.5" y2="222.0" stroke="#2dd4bf" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="390.0" cy="222.0" r="4.0" fill="#8b949e" opacity="1"/><circle cx="416.5" cy="222.0" r="6.0" fill="#2dd4bf" opacity="1"/><text x="428.5" y="226.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600" fill="#2dd4bf" text-anchor="start" opacity="1">1.18×</text><text x="30.0" y="266.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">rand write 4K</text><text x="348.0" y="266.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="400" fill="#9aa3ab" text-anchor="end" opacity="1">14,114 → 20,551 IOPS</text><line x1="390.0" y1="262.0" x2="458.4" y2="262.0" stroke="#2dd4bf" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="390.0" cy="262.0" r="4.0" fill="#8b949e" opacity