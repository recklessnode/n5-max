<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img"><rect width="960" height="640" rx="14" fill="#151a1f"/><text x="24" y="34" font-family="Orbitron, Ubuntu, sans-serif" font-size="17" font-weight="700" fill="#e9e6e0" letter-spacing="0.5">Recipe: which pool for which box</text><text x="24" y="56" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" fill="#9aa3ab">A decision path built from the sealed evidence. Numbers are the published cold-regime cases quoted in the report.</text><text x="24" y="628" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="10.5" fill="#5f6a73">SATA bays (5×3.5&quot;, JMB58x Gen3 x2 shared) were not benchmarked; SLOG (#57) and the btrfs write-hole test (#59) were not run.</text><rect x="330.0" y="74.0" width="300.0" height="46.0" rx="23" fill="#1b2229" fill-opacity="1" stroke="#9aa3ab" stroke-width="1.2" /><text x="480.0" y="103.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e9e6e0" text-anchor="middle" opacity="1">What does the box mostly do?</text><path d="M480,120 C480,150 165,140 165,172" stroke="#5f6a73" fill="none" stroke-width="1.5" opacity="1" stroke-linejoin="round" stroke-linecap="round" /><text x="165.0" y="192.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="13.5" font-weight="700" fill="#2dd4bf" text-anchor="middle" opacity="1">AI-first RAG box</text><rect x="25.0" y="206.0" width="280.0" height="42.0" rx="21" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5" /><text x="165.0" y="233.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e9e6e0" text-anchor="middle" opacity="1">ZFS RAIDZ1 · 5-wide</text><rect x="25.0" y="262.0" width="280.0" height="172.0" rx="10" fill="#1b2229" fill-opacity="1" /><text x="41.0" y="286.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="10" font-weight="700" fill="#9aa3ab" text-anchor="start" opacity="1">WHY</text><circle cx="43.0" cy="307.0" r="3.0" fill="#2dd4bf" opacity="1"/><text x="53.0" y="311.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">14.11 TiB, cold seq read 7.83 GB/s</text><circle cx="43.0" cy="337.0" r="3.0" fill="#2dd4bf" opacity="1"/><text x="53.0" y="341.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">degraded read keeps 93.51 %</text><circle cx="43.0" cy="367.0" r="3.0" fill="#2dd4bf" opacity="1"/><text x="53.0" y="371.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">rebuild 29 min @ 1.1656 GB/s</text><circle cx="43.0" cy="397.0" r="3.0" fill="#2dd4bf" opacity="1"/><text x="53.0" y="401.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">tg btrfs 12.44 ≈ ext4 12.34 tok/s</text><rect x="25.0" y="444.0" width="280.0" height="82.0" rx="10" fill="#1b2229" fill-opacity="1" stroke="#fbbf24" stroke-width="0.8" /><text x="41.0" y="466.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="start" opacity="1">WATCH</text><text x="41.0" y="489.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">▸ HIP for prefill, Vulkan for decode</text><text x="41.0" y="511.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">▸ Vulkan cold load 1.34–5.22× slower</text><path d="M480,120 C480,150 480,140 480,172" stroke="#5f6a73" fill="none" stroke-width="1.5" opacity="1" stroke-linejoin="round" stroke-linecap="round" /><text x="480.0" y="192.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="13.5" font-weight="700" fill="#E86A2B" text-anchor="middle" opacity="1">AI + VM server</text><rect x="340.0" y="206.0" width="280.0" height="42.0" rx="21" fill="#E86A2B" fill-opacity="0.16" stroke="#E86A2B" stroke-width="1.5" /><text x="480.0" y="233.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e9e6e0" text-anchor="middle" opacity="1">ZFS RAID10 (VMs) + RAIDZ1</text><rect x="340.0" y="262.0" width="280.0" height="172.0" rx="10" fill="#1b2229" fill-opacity="1" /><text x="356.0" y="286.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="10" font-weight="700" fill="#9aa3ab" text-anchor="start" opacity="1">WHY</text><circle cx="358.0" cy="307.0" r="3.0" fill="#E86A2B" opacity="1"/><text x="368.0" y="311.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">RAID10 sync 16K 1,675 IOPS</text><circle cx="358.0" cy="337.0" r="3.0" fill="#E86A2B" opacity="1"/><text x="368.0" y="341.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">vs RAIDZ1 415 IOPS</text><circle cx="358.0" cy="367.0" r="3.0" fill="#E86A2B" opacity="1"/><text x="368.0" y="371.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">RAID10 mixed 16K 104,485 IOPS</text><circle cx="358.0" cy="397.0" r="3.0" fill="#E86A2B" opacity="1"/><text x="368.0" y="401.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">SATA bays → separate cold pool</text><rect x="340.0" y="444.0" width="280.0" height="82.0" rx="10" fill="#1b2229" fill-opacity="1" stroke="#fbbf24" stroke-width="0.8" /><text x="356.0" y="466.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="start" opacity="1">WATCH</text><text x="356.0" y="489.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">▸ NM790: no PLP, SLOG untested</text><text x="356.0" y="511.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">▸ SATA tier unmeasured</text><path d="M480,120 C480,150 795,140 795,172" stroke="#5f6a73" fill="none" stroke-width="1.5" opacity="1" stroke-linejoin="round" stroke-linecap="round" /><text x="795.0" y="192.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="13.5" font-weight="700" fill="#a78bfa" text-anchor="middle" opacity="1">Media / archive</text><rect x="655.0" y="206.0" width="280.0" height="42.0" rx="21" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.5" /><text x="795.0" y="233.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e9e6e0" text-anchor="middle" opacity="1">ZFS RAIDZ2 · 5-wide</text><rect x="655.0" y="262.0" width="280.0" height="172.0" rx="10" fill="#1b2229" fill-opacity="1" /><text x="671.0" y="286.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="10" font-weight="700" fill="#9aa3ab" text-anchor="start" opacity="1">WHY</text><circle cx="673.0" cy="307.0" r="3.0" fill="#a78bfa" opacity="1"/><text x="683.0" y="311.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">10.21 TiB, cold seq read 8.911 GB/s</text><circle cx="673.0" cy="337.0" r="3.0" fill="#a78bfa" opacity="1"/><text x="683.0" y="341.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">survives two drive failures</text><circle cx="673.0" cy="367.0" r="3.0" fill="#a78bfa" opacity="1"/><text x="683.0" y="371.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">degraded read keeps 59.55 %</text><circle cx="673.0" cy="397.0" r="3.0" fill="#a78bfa" opacity="1"/><text x="683.0" y="401.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11.2" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">USB ingest 905.6 / 376.2 MB/s r/w</text><rect x="655.0" y="444.0" width="280.0" height="82.0" rx="10" fill="#1b2229" fill-opacity="1" stroke="#fbbf24" stroke-width="0.8" /><text x="671.0" y="466.0" font-family="Orbitron, Ubuntu, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="start" opacity="1">WATCH</text><text x="671.0" y="489.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">▸ RAIDZ1 if capacity matters more</text><text x="671.0" y="511.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#e9e6e0" text-anchor="start" opacity="1">▸ scrub + offsite copy still required</text><rect x="25.0" y="544.0" width="910.0" height="56.0" rx="10" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-width="1" /><text x="45.0" y="568.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#e9e6e0" text-anchor="start" opacity="1">Any workload: btrfs raid5/6 is the fastest healthy pool, but not for data you cannot re-download.</text><text x="45.0" y="588.0" font-family="'Intel One Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#9aa3ab" text-anchor="start" opacity="1">Degraded seq read 5.87 % of healthy · rebuild 62 min · write-hole unmitigated (raid1c3 = metadata only)</text></svg>