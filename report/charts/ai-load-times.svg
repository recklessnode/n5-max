<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img"><rect width="960" height="500" rx="14" fill="#151a1f"/><text x="24" y="34" font-family="Orbitron, Ubuntu, sans-serif" font-size="17" font-weight="700" fill="#e9e6e0" letter-spacing="0.5">Cold model load: backend and placement beat layout</text><text x="24" y="56" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" fill="#9aa3ab">Seconds from cold cache to first token-ready (stage 3, AI-01 load rail). Pairs differ in one factor only.</text><text x="24" y="488" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="10.5" fill="#5f6a73">Streamed = mmap without full residency (model larger than practical GPU memory). All ZFS AI cells: primarycache=all, ARC cold at start; btrfs: page cache dropped.</text><text x="30.0" y="92.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500" fill="#e9e6e0" text-anchor="start" opacity="1">Layout: btrfs raid5 vs ZFS RAIDZ1</text><circle cx="566.0" cy="88.0" r="5.5" fill="#a78bfa" opacity="1"/><text x="580.0" y="92.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#9aa3ab" text-anchor="start" opacity="1">btrfs</text><circle cx="626.0" cy="88.0" r="5.5" fill="#2dd4bf" opacity="1"/><text x="640.0" y="92.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#9aa3ab" text-anchor="start" opacity="1">ZFS</text><text x="250.0" y="118.0" font-family="Ubuntu, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#9aa3ab" text-anchor="end" opacity="1">Gemma 4 26B</text><line x1="300.0" y1="114.0" x2="880.0" y2="114.0" stroke="#262e36" stroke-width="1" stroke-opacity="1" stroke-linecap="butt"/><line x1="469.8" y1="114.0" x2="500.7" y2="114.0" stroke="#5f6a73" stroke-width="3" stroke-opacity="1" stroke-linecap="round"/><circle cx="469.8" cy="114.0" r="6.0" fill="#a78bfa" opacity="1"/><circle cx="500.7" cy="114.0" r="6.0" fill="#2d